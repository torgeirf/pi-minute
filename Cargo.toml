[package]
name = "pi-minute"
version = "0.2.1"
edition = "2024"
description = "Compute as many digits of pi as possible in a time limit, shown live in a GPU-rendered GUI"
license = "MIT"
repository = "https://github.com/torgeirf/pi-minute"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
malachite-base = "0.14.0"
malachite-nz = "0.14.0"
rayon = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading", "Win32_Foundation"] }

